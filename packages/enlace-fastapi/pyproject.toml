[project]
name = "enlace-fastapi"
version = "0.0.2"
description = "Simple FastAPI adapter for @get-enlace/ui. Early dev preview: no persistence yet (serves the spec + UI bundle only)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "BugDiver Technologies" }]
urls = { Repository = "https://github.com/get-enlace/enlace-python", "Source" = "https://github.com/get-enlace/enlace-python/tree/main/packages/enlace-fastapi" }
dependencies = [
    "fastapi>=0.100",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# hatchling's "packages" builder copies the whole src/enlace_fastapi/
# directory as-is (not just .py files), so ui_embedded/ — populated by
# ../../scripts/dev-sync-ui.sh or ci-fetch-ui.sh, never hand-edited or
# committed (see repo .gitignore) — rides along automatically; no separate
# force-include/artifacts entry needed (and adding one double-includes it).
packages = ["src/enlace_fastapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
